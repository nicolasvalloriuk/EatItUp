<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- metadata for search engines -->
  <meta name="description" content="Search for recipes using TheMealDB API. Enter a keyword to find delicious meals and their details.">
  <meta name="keywords" content="recipe search, TheMealDB, meals, cooking, food, ingredients">
  <!-- Title -->
  <title>Eat It Up!</title>
  <!-- favicon -->
  <link rel="icon" href="assets/images/favicons/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicons/favicon-16x16.png">
  
  <!-- Imports -->
    
    <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    
  <!-- Google Fonts-->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&display=swap');
  </style>
    <!-- CSS  -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <header>
  <!-- Navigation -->
    <nav class="navbar">
        <div class="container-fluid">
            <a class="navbar-brand logo" href="index.html">
                <img class="logo-img" src="assets/images/favicons/android-chrome-192x192.png" alt="Logo">
                Eat It Up!
            </a>
        </div>
    </nav>
  </header>
  <main>
    <div class="container-fluid mt-4">
      <div class="row">
        <!-- Weekly Recipe Section -->
        <div class="col-12"> 
          <h1 class="visually-hidden">Eat It Up! – Recipe Search</h1>
          <h2 class="mb-4 text-center">Recipe of the Week!</h2>

          <div id="weekly-recipe" class="row">
          <!-- Weekly Recipe Image Left side -->
            <div class="col-12 col-md-6 d-flex align-items-center justify-content-center">
              <img id="weekly-img" alt="Weekly Recipe image" class="img-fluid" src="assets/images/error-image/recipe-src-alternative.jpg">
            </div>
            <!-- Weekly Title and description -->
            <div class="col-12 col-md-6 d-flex flex-column align-items-center justify-content-center weekly-recipe-section">
              <h3 id="weekly-title">Weekly Recipe</h3>
              <button id="weekly-button" class="btn btn-outline-secondary mt-3 my-custom-btn">View Recipe</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="container-fluid mt-4">
      <div class="row">
        <!-- Search Bar -->
        <div class="search-wrapper align-items-center justify-content-center">
          
          <div class="search-container">
            <input class="form-control me-2" id="query" type="text" placeholder="Search" style="width: 250px;" aria-label="Search">
            <div id="suggestions"></div>  
          </div>
            <button class="btn btn-outline-secondary my-custom-btn" id="searchBtn">Search</button>
        </div>  
      </div>
      
    </div>
  </main>
  <footer>

  </footer>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <!-- JS -->
  <script src="assets/js/script.js"></script>
</body>
</html>
